spring.application.name=query.blog

# 프로젝트 루트의 .env를 프로퍼티로 읽음
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# rewriteBatchedStatements : addBatch()로 모은 insert를 multi-value INSERT 한 문장으로 합쳐 전송
spring.datasource.url=jdbc:mysql://localhost:3306/reserve_project?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
